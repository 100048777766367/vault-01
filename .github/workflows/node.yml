name: Vault Industrial Invariant Lifecycle

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
  schedule:
    - cron: '15 */4 * * *'

permissions:
  contents: write

jobs:
  run-vault:
    runs-on: ubuntu-latest
    steps:
      # 1. KÉO CODE BẰNG LINUX SHELL GỐC
      - name: Kéo mã nguồn Vault
        run: |
          git clone --depth 1 https://github.com/${{ github.repository }}.git .

      # 2. THIẾT LẬP PYTHON 3.12
      - name: Thiết lập môi trường Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # 3. VẬN HÀNH DÂY CHUYỀN TINH CHẾ KERNEL.PY
      - name: Vận hành Nhà Máy Dữ Liệu
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: python kernel.py

      # 4. LƯU THÀNH PHẨM VÀ SỔ CÁI VÀO GIT
      - name: Lưu vết tích xuất xưởng vào Git
        run: |
          git config --global user.name "Vault-Foundry-Bot"
          git config --global user.email "bot@vault.foundry"
          
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          
          TARGET_BRANCH=$(git rev-parse --abbrev-ref HEAD)
          [ "$TARGET_BRANCH" = "HEAD" ] || [ -z "$TARGET_BRANCH" ] && TARGET_BRANCH="main"

          git fetch origin "$TARGET_BRANCH"
          git reset origin/"$TARGET_BRANCH"
          
          # Stage an toàn tất cả phân xưởng và thành phẩm dist/
          for d in collector refinery marketplace treasury dist organs synapses; do
            [ -d "$d" ] && git add -A "$d"
          done
          git add contract.json 2>/dev/null || true
          
          if ! git diff --staged --quiet; then
            git commit -m "🏛️ [Vault Foundry] Tinh chế & Xuất xưởng lô hàng dữ liệu sạch #(1+N) [skip ci]"
            git push origin "$TARGET_BRANCH"
          else
            echo "Kho hàng tĩnh lặng, không có biến thiên mới."
          fi
