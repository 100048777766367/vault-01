name: Vault-01 Lineage Evolution Lifecycle

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
  schedule:
    - cron: '15 */4 * * *'

permissions:
  contents: write

jobs:
  run-vault01:
    runs-on: ubuntu-latest
    steps:
      - name: Kéo mã nguồn Vault-01
        run: |
          git clone --depth 1 https://github.com/${{ github.repository }}.git .

      - name: Thiết lập môi trường Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Vận hành Đốc Công F1 Tự Phôi Thai
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: python kernel.py

      - name: Lưu vết toàn bộ thành phẩm F1 lên Git
        run: |
          git config --global user.name "Vault-01-Prodigy-Bot"
          git config --global user.email "bot@vault01.node"
          
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          
          TARGET_BRANCH=$(git rev-parse --abbrev-ref HEAD)
          [ "$TARGET_BRANCH" = "HEAD" ] || [ -z "$TARGET_BRANCH" ] && TARGET_BRANCH="main"

          git fetch origin "$TARGET_BRANCH"
          git reset origin/"$TARGET_BRANCH"
          
          git add -A
          
          if ! git diff --staged --quiet; then
            git commit -m "🏛️ [Vault-01 F1] Vượt tổ với 5 màng lọc xếp tầng & Xuất xưởng thành phẩm #(1+N) [skip ci]"
            git push origin "$TARGET_BRANCH"
          else
            echo "Kho hàng tĩnh lặng, không có biến thiên mới."
          fi
